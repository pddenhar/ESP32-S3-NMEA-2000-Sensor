## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'


  # NMEA 2000 core stack. Not on the ESP Component Registry, so it comes
  # straight from git. The dependency key sets the component name, and it must
  # be exactly `NMEA2000` for components/NMEA2000_twai's `REQUIRES NMEA2000`
  # to resolve.
  #
  # The matching TWAI transport is vendored in components/NMEA2000_twai rather
  # than fetched -- see the README there for why.
  NMEA2000:
    git: https://github.com/ttlappalainen/NMEA2000.git
    version: master
