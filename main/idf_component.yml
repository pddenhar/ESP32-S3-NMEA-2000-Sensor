## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  bobscott45/waveshare_esp32_s3_touch_lcd_4_3: ^1.0.7

  # NMEA 2000 core stack. Not on the ESP Component Registry, so it comes
  # straight from git. The dependency key sets the component name, and it must
  # be exactly `NMEA2000` for components/NMEA2000_twai's `REQUIRES NMEA2000`
  # to resolve.
  #
  # The matching TWAI transport is vendored in components/NMEA2000_twai rather
  # than fetched -- see the README there for why.
  NMEA2000:
    git: https://github.com/ttlappalainen/NMEA2000.git
    version: master
